<style>

  .tree-node.inserting circle { fill: rgba(255,214,10,0.22); stroke: var(--node-insert); stroke-width: 3;

  .tree-node.visited circle { fill: rgba(6,182,212,0.06); stroke: var(--node-border); opacity: 0.5; }

<body>
<header>
  <h1>🌳 Cây nhị phân tìm kiếm — BST</h1>
  <span class="badge">Module 1 · Cấu trúc dữ liệu</span>
  <span class="badge">Left &lt; Root &lt; Right</span>
  <span class="badge">O(log n) avg · O(n) worst</span>
</header>

<div class="main">
  <div class="viz">
    <div class="ops-bar">
      <button class="op-btn active" onclick="selectOp('insert',event)">➕ Insert</button>
      <button class="op-btn" onclick="selectOp('search',event)">🔍 Search</button>
      <button class="op-btn" onclick="selectOp('delete',event)">🗑 Delete</button>
      <button class="op-btn" onclick="selectOp('inorder',event)">↙ In-order</button>
      <button class="op-btn" onclick="selectOp('preorder',event)">↖ Pre-order</button>
      <button class="op-btn" onclick="selectOp('postorder',event)">↗ Post-order</button>
    </div>
    <div class="input-row">
      <label id="lbl1">Giá trị:</label>
      <input type="number" id="inp1" value="45" min="1" max="99">
      <button class="run-btn" onclick="runOperation()">▶ Chạy</button>
      <div class="complexity-row">
        <div class="complexity-badge active-badge"><div class="label">Avg case</div><div class="value green">O(log n)</div></div>
        <div class="complexity-badge"><div class="label">Worst (skewed)</div><div class="value red">O(n)</div></div>
      </div>
    </div>
    <div class="canvas-area">
      <svg id="treeSvg"></svg>
      <div class="traversal-order" id="traversalRow" style="display:none">
        <span class="label" id="travLabel">Thứ tự:</span>
      </div>

    </div>
  </div>
  <div class="code-panel">
    <div class="code-panel-header">📄 Pseudocode — <span id="codeTitle">BST Insert</span></div>
    <div class="code-body" id="codeBody"></div>
  </div>
</div>

<div class="controls">
  <button class="ctrl-btn" onclick="stepBack()">⏮</button>
  <button class="ctrl-btn" id="btnPlay" onclick="togglePlay()">▶</button>
  <button class="ctrl-btn" onclick="stepForward()">⏭</button>
  <button class="ctrl-btn" onclick="resetAll()">🔄</button>
  <div class="speed-group">🐢 <input type="range" id="speedSlider" min="1" max="5" value="3"> 🐇</div>
  <div class="step-info" id="stepInfo">Bước 0 / 0</div>
</div>

<script>
class BSTNode {
  constructor(val) { this.val=val; this.left=null; this.right=null; }
}

function bstInsert(root, val) {
  if (!root) return new BSTNode(val);
  if (val < root.val) root.left = bstInsert(root.left, val);
  else if (val > root.val) root.right = bstInsert(root.right, val);
  return root;
}

function bstDelete(root, val) {
  if (!root) return null;
  if (val < root.val) { root.left = bstDelete(root.left, val); }
  else if (val > root.val) { root.right = bstDelete(root.right, val); }
  else {
    if (!root.left) return root.right;
    if (!root.right) return root.left;
    let succ = root.right;
    while (succ.left) succ = succ.left;
    root.val = succ.val;
    root.right = bstDelete(root.right, succ.val);
  }
  return root;
}

function cloneTree(node) {
  if (!node) return null;
  const n = new BSTNode(node.val);
  n.left = cloneTree(node.left);
  n.right = cloneTree(node.right);
  return n;
}

let root = null;
const initVals = [50, 30, 70, 20, 40, 60, 80];
initVals.forEach(v => root = bstInsert(root, v));

let currentOp = 'insert';
let steps = [], stepIdx = -1, playing = false, playTimer = null;
const speedMap = { 1:1200, 2:900, 3:600, 4:350, 5:180 };

function layoutTree(node, x, y, spread) {
  if (!node) return {};
  const positions = {};
  positions[node.val] = {x, y};
  Object.assign(positions, layoutTree(node.left, x-spread, y+64, spread/2));
  Object.assign(positions, layoutTree(node.right, x+spread, y+64, spread/2));
  return positions;
}

function collectEdges(node, positions) {
  if (!node) return [];
  const edges = [];
  if (node.left) { edges.push({from:node.val, to:node.left.val}); edges.push(...collectEdges(node.left, positions)); }
  if (node.right) { edges.push({from:node.val, to:node.right.val}); edges.push(...collectEdges(node.right, positions)); }
  return edges;
}

function renderTree(treeRoot, highlights={}, activeEdges=[], newNode=null) {
  const svg = document.getElementById('treeSvg');
  const W = svg.clientWidth || 520;
  svg.innerHTML = '';
  if (!treeRoot) return;
  const positions = layoutTree(treeRoot, W/2, 28, W/4);
  const edges = collectEdges(treeRoot, positions);

  // Edges
  edges.forEach(e => {
    const p1 = positions[e.from], p2 = positions[e.to];
    if (!p1||!p2) return;
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',p1.x); line.setAttribute('y1',p1.y);
    line.setAttribute('x2',p2.x); line.setAttribute('y2',p2.y);
    const isActive = activeEdges.includes(`${e.from}-${e.to}`);
    let cls = 'tree-edge' + (isActive ? ' active' : '');
    if (e.to === newNode) cls += ' tree-edge-new';
    line.setAttribute('class', cls);
    svg.appendChild(line);
  });

  // Nodes
  function drawNode(node) {
    if (!node) return;
    const pos = positions[node.val];
    if (!pos) return;
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    let cls = 'tree-node';
    if (highlights[node.val]) cls += ' ' + highlights[node.val];
    if (node.val === newNode) cls += ' tree-node-new';
    g.setAttribute('class', cls);
    const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',pos.x); c.setAttribute('cy',pos.y); c.setAttribute('r',22);
    // Gradient fill via inline style
    c.setAttribute('style', node.val === newNode ? 'fill:rgba(255,214,10,0.2)' : '');
    const t = document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',pos.x); t.setAttribute('y',pos.y); t.textContent=node.val;
    g.appendChild(c); g.appendChild(t);
    svg.appendChild(g);
    drawNode(node.left); drawNode(node.right);
  }
  drawNode(treeRoot);
}

const codes = {
  insert: { title:'BST Insert — O(log n) avg', lines:[
    ['cm','// Chèn giá trị vào BST'],
    ['kw','function ','fn','insert','(root, val):'],
    ['kw','  if ','','root == null:'],
    ['kw','    return ','kw','new ','','Node(val)'],
    ['kw','  if ','','val < root.val:'],
    ['','    root.left = ','fn','insert','(root.left, val)'],
    ['kw','  else if ','','val > root.val:'],
    ['','    root.right = ','fn','insert','(root.right, val)'],
    ['kw','  return ','','root ','cm','// đã tồn tại'],
  ]},
  search: { title:'BST Search — O(log n) avg', lines:[
    ['cm','// Tìm kiếm trong BST'],
    ['kw','function ','fn','search','(root, val):'],
    ['kw','  if ','','root == null: ','kw','return ','','null'],
    ['kw','  if ','','val == root.val: ','kw','return ','','root'],
    ['kw','  if ','','val < root.val:'],
    ['kw','    return ','fn','search','(root.left, val)'],
    ['kw','  return ','fn','search','(root.right, val)'],
    ['cm','// Mỗi bước loại ½ cây → O(log n)'],
  ]},
  delete: { title:'BST Delete — 3 trường hợp', lines:[
    ['cm','// Xóa có 3 TH: leaf, 1 con, 2 con'],
    ['kw','function ','fn','delete','(root, val):'],
    ['kw','  if ','','val < root.val: ','cm','// đi trái'],
    ['','    root.left = ','fn','delete','(root.left, val)'],
    ['kw','  else if ','','val > root.val: ','cm','// đi phải'],
    ['','    root.right = ','fn','delete','(root.right, val)'],
    ['kw','  else: ','cm','// tìm thấy!'],
    ['kw','    if ','','!root.left: ','kw','return ','','root.right'],
    ['kw','    if ','','!root.right: ','kw','return ','','root.left'],
    ['cm','    // 2 con: tìm successor (min phải)'],
    ['','    succ = ','fn','minNode','(root.right)'],
    ['','    root.val = succ.val'],
    ['','    root.right = ','fn','delete','(root.right, succ)'],
  ]},
  inorder: { title:'In-order: Left → Root → Right', lines:[
    ['cm','// In-order → ra thứ tự tăng dần!'],
    ['kw','function ','fn','inOrder','(node, result):'],
    ['kw','  if ','','node == null: ','kw','return'],
    ['fn','  inOrder','(node.left, result)'],
    ['cm','  // Thăm node ở giữa'],
    ['','  result.push(node.val)'],
    ['fn','  inOrder','(node.right, result)'],
    ['kw','  return ','','result ','cm','// sorted!'],
  ]},
  preorder: { title:'Pre-order: Root → Left → Right', lines:[
    ['cm','// Pre-order: Root đầu tiên'],
    ['kw','function ','fn','preOrder','(node, result):'],
    ['kw','  if ','','node == null: ','kw','return'],
    ['cm','  // Thăm Root TRƯỚC'],
    ['','  result.push(node.val)'],
    ['fn','  preOrder','(node.left, result)'],
    ['fn','  preOrder','(node.right, result)'],
    ['cm','// Dùng: copy tree, serialize'],
  ]},
  postorder: { title:'Post-order: Left → Right → Root', lines:[
    ['cm','// Post-order: Root cuối cùng'],
    ['kw','function ','fn','postOrder','(node, result):'],
    ['kw','  if ','','node == null: ','kw','return'],
    ['fn','  postOrder','(node.left, result)'],
    ['fn','  postOrder','(node.right, result)'],
    ['cm','  // Thăm Root SAU'],
    ['','  result.push(node.val)'],
    ['cm','// Dùng: xóa cây, tính expression'],
  ]}
};

function renderCode(op, hl=-1) {
  const c = codes[op];
  document.getElementById('codeTitle').textContent = c.title;
  const body = document.getElementById('codeBody');
  body.innerHTML = '';
  c.lines.forEach((parts,i) => {
    const div = document.createElement('div');
    div.className = 'code-line'+(i===hl?' highlight':'');
    const ln = document.createElement('span'); ln.className='ln'; ln.textContent=i+1;
    const txt = document.createElement('span'); txt.className='code-text';
    let html='';
    for(let j=0;j<parts.length;j+=2){const cls=parts[j],cnt=parts[j+1]||''; html+=cls?`<span class="${cls}">${cnt}</span>`:cnt;}
    txt.innerHTML=html; div.appendChild(ln); div.appendChild(txt);
    body.appendChild(div);
    if(i===hl) div.scrollIntoView({block:'nearest'});
  });
}

function inOrder(node, out=[]) { if(!node) return out; inOrder(node.left,out); out.push(node.val); inOrder(node.right,out); return out; }
function preOrder(node, out=[]) { if(!node) return out; out.push(node.val); preOrder(node.left,out); preOrder(node.right,out); return out; }
function postOrder(node, out=[]) { if(!node) return out; postOrder(node.left,out); postOrder(node.right,out); out.push(node.val); return out; }

function renderTraversalRow(order, litUpTo=-1) {
  const row = document.getElementById('traversalRow');
  row.style.display = 'flex';
  row.innerHTML = `<span class="label">Thứ tự:</span>`;
  order.forEach((val,i) => {
    const t = document.createElement('div');
    t.className='tnode'+(i<=litUpTo?' lit':'');
    t.textContent=val; row.appendChild(t);
  });
}

function buildSteps(op, val) {
  steps = [];
  if (['inorder','preorder','postorder'].includes(op)) {
    const fn = op==='inorder'?inOrder:op==='preorder'?preOrder:postOrder;
    const order = fn(root);
    steps.push({ highlights:{}, trav:order, travLit:-1, code:-1, msg:`${op} — ${order.length} node` });
    const path=[]; function collect(n){if(!n)return;
      if(op==='inorder'){collect(n.left);path.push(n.val);collect(n.right);}
      else if(op==='preorder'){path.push(n.val);collect(n.left);collect(n.right);}
      else{collect(n.left);collect(n.right);path.push(n.val);}
    } collect(root);
    path.forEach((v,i)=>{
      steps.push({ highlights:{[v]:'found'}, trav:order, travLit:i,
        code:op==='inorder'?5:op==='preorder'?4:6, msg:`Thăm node ${v} (${i+1}/${path.length})` });
    });
    steps.push({ highlights:{}, trav:order, travLit:order.length-1, code:7,
      msg:`✓ Xong — kết quả: [${order.join(', ')}]` });
    return;
  }

  if (op === 'insert') {
    let cur = root, edges = [];
    steps.push({ highlights:{}, edges:[], code:-1, msg:`Chèn ${val} vào BST` });
    while (cur) {
      if (val === cur.val) {
        steps.push({ highlights:{[cur.val]:'found'}, code:8, msg:`${val} đã tồn tại trong cây` });
        return;
      }
      const cmpCode = val < cur.val ? 4 : 6;
      steps.push({ highlights:{[cur.val]:'active'}, edges:[...edges], code:cmpCode,
        msg: val < cur.val ? `${val} < ${cur.val} → đi sang TRÁI` : `${val} > ${cur.val} → đi sang PHẢI` });
      const next = val < cur.val ? cur.left : cur.right;
      if (next) edges = [...edges, `${cur.val}-${next.val}`];
      cur = next;
    }
    root = bstInsert(root, val);
    steps.push({ highlights:{[val]:'inserting'}, edges, code:3, newNode:val, msg:`Chèn node mới: ${val} — thả xuống!` });
    steps.push({ highlights:{[val]:'found'}, edges, code:7, msg:`✓ Đã thêm ${val} vào BST — O(log n)` });
  } else if (op === 'search') {
    let cur = root; const edges = [];
    steps.push({ highlights:{}, edges:[], code:-1, msg:`Tìm kiếm ${val} trong BST` });
    while (cur) {
      steps.push({ highlights:{[cur.val]:'active'}, edges:[...edges], code:3, msg:`Kiểm tra node ${cur.val}` });
      if (val === cur.val) {
        steps.push({ highlights:{[cur.val]:'found'}, code:3, msg:`✓ Tìm thấy ${val}!` }); return;
      }
      const cmpCode = val < cur.val ? 4 : 6;
      steps.push({ highlights:{[cur.val]:'visited'}, edges:[...edges], code:cmpCode,
        msg: val < cur.val ? `${val} < ${cur.val} → tìm cây TRÁI` : `${val} > ${cur.val} → tìm cây PHẢI` });
      const next = val < cur.val ? cur.left : cur.right;
      if (next) edges.push(`${cur.val}-${next.val}`);
      cur = next;
    }
    steps.push({ highlights:{}, edges:[], code:2, msg:`✗ Không tìm thấy ${val}` });
  } else if (op === 'delete') {
    let cur = root;
    steps.push({ highlights:{}, code:-1, msg:`Xóa ${val} khỏi BST` });
    while (cur) {
      const cmpCode = val < cur.val ? 2 : val > cur.val ? 4 : 6;
      steps.push({ highlights:{[cur.val]:'active'}, code:cmpCode, msg:
        val < cur.val ? `${val} < ${cur.val} → đi TRÁI` :
        val > cur.val ? `${val} > ${cur.val} → đi PHẢI` :
        `Tìm thấy ${cur.val}! Kiểm tra trường hợp...` });
      if (val === cur.val) break;
      cur = val < cur.val ? cur.left : cur.right;
    }
    if (!cur) { steps.push({ highlights:{}, code:1, msg:`✗ ${val} không có trong cây` }); return; }
    const hasLeft=!!cur.left, hasRight=!!cur.right;
    if (!hasLeft && !hasRight) {
      steps.push({ highlights:{[cur.val]:'deleting'}, code:7, msg:`Trường hợp 1: Leaf node — xóa trực tiếp` });
    } else if (!hasLeft || !hasRight) {
      const child = cur.left || cur.right;
      steps.push({ highlights:{[cur.val]:'deleting', [child.val]:'active'}, code:7,
        msg:`Trường hợp 2: 1 con — nối ${child.val} lên thay ${cur.val}` });
    } else {
      let succ = cur.right;
      while (succ.left) succ = succ.left;
      steps.push({ highlights:{[cur.val]:'deleting'}, code:9, msg:`Trường hợp 3: 2 con — tìm in-order successor` });
      steps.push({ highlights:{[cur.val]:'deleting', [succ.val]:'inserting'}, code:10,
        msg:`In-order successor = ${succ.val} (min của cây phải)` });
      steps.push({ highlights:{[succ.val]:'found'}, code:11,
        msg:`Copy ${succ.val} → vị trí ${cur.val}, xóa ${succ.val} khỏi cây phải` });
    }
    root = bstDelete(root, val);
    steps.push({ highlights:{}, code:12, msg:`✓ Đã xóa ${val} thành công` });
  }
}

function applyStep(idx) {
  if (idx<0||idx>=steps.length) return;
  const s = steps[idx];
  renderTree(root, s.highlights||{}, s.edges||[], s.newNode||null);
  if (s.trav !== undefined) renderTraversalRow(s.trav, s.travLit??-1);
  else document.getElementById('traversalRow').style.display='none';
  renderCode(currentOp, s.code);
  const msg = document.getElementById('statusMsg');
  msg.textContent = s.msg||'';
  msg.className = 'status-msg'+(s.msg?.startsWith('✓')?' success':s.msg?.startsWith('✗')?' error':' info');
  document.getElementById('stepInfo').textContent = `Bước ${idx+1} / ${steps.length}`;
}

function stepForward() { if(stepIdx<steps.length-1){stepIdx++;applyStep(stepIdx);}else stopPlay(); }
function stepBack()    { if(stepIdx>0){stepIdx--;applyStep(stepIdx);} }
function togglePlay()  { playing?stopPlay():startPlay(); }
function startPlay() {
  playing=true; document.getElementById('btnPlay').textContent='⏸';
  function tick() {
    if(stepIdx<steps.length-1){stepIdx++;applyStep(stepIdx);
      playTimer=setTimeout(tick,speedMap[document.getElementById('speedSlider').value]);
    } else stopPlay();
  }
  tick();
}
function stopPlay() { playing=false;document.getElementById('btnPlay').textContent='▶';clearTimeout(playTimer); }

function selectOp(op,e) {
  currentOp=op;
  document.querySelectorAll('.op-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  const lbl=document.getElementById('lbl1');
  const inp=document.getElementById('inp1');
  if(['inorder','preorder','postorder'].includes(op)){lbl.textContent='(không cần)';inp.style.display='none';}
  else{lbl.textContent='Giá trị:';inp.style.display='';}
  resetAll();
}

function runOperation() {
  stopPlay();
  root=null; initVals.forEach(v=>root=bstInsert(root,v));
  const val=parseInt(document.getElementById('inp1').value)||45;
  buildSteps(currentOp,val);
  stepIdx=-1;
  renderTree(root,{});
  document.getElementById('traversalRow').style.display='none';
  renderCode(currentOp,-1);
  document.getElementById('statusMsg').textContent='Nhấn ⏭ để từng bước';
  document.getElementById('statusMsg').className='status-msg';
  document.getElementById('stepInfo').textContent=`Bước 0 / ${steps.length}`;
}

function resetAll() {
  stopPlay();
  root=null; initVals.forEach(v=>root=bstInsert(root,v));
  steps=[]; stepIdx=-1;
  renderTree(root,{});
  document.getElementById('traversalRow').style.display='none';
  renderCode(currentOp,-1);
  document.getElementById('statusMsg').textContent='Chọn thao tác và nhấn ▶ Chạy';
  document.getElementById('statusMsg').className='status-msg';
  document.getElementById('stepInfo').textContent='Bước 0 / 0';
}

renderTree(root,{});
renderCode('insert',-1);
window.addEventListener('resize', ()=>renderTree(root,{}));
</script>
