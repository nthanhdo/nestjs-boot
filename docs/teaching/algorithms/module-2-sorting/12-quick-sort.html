<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Sort — Sắp xếp nhanh</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#080c14;color:#e2e8f0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(192,132,252,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(192,132,252,.04) 1px,transparent 1px);background-size:32px 32px;pointer-events:none;z-index:0}

header{background:linear-gradient(135deg,#0d0614,#1a0a2e);padding:10px 20px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #3b0764;position:relative;z-index:1}
header h1{font-size:1.1rem;color:#c084fc;text-shadow:0 0 20px rgba(192,132,252,.4)}
.badge{background:#3b0764;color:#d8b4fe;padding:2px 8px;border-radius:4px;font-size:.75rem}
.complexity{display:flex;gap:8px;margin-left:auto}
.cx{background:#1e293b;border:1px solid #334155;border-radius:4px;padding:2px 8px;font-size:.75rem;color:#94a3b8}
.cx span{color:#fbbf24}

main{flex:1;display:flex;overflow:hidden;position:relative;z-index:1}
#viz{width:60%;background:transparent;display:flex;flex-direction:column}
#bar-area{flex:1;position:relative;padding:10px 20px 0;overflow:hidden}
#bars-container{position:absolute;bottom:0;left:20px;right:20px;top:10px;display:flex;align-items:flex-end;gap:3px}

.bar-wrap{display:flex;flex-direction:column;align-items:center;flex:1;position:relative}
.bar{width:100%;border-radius:4px 4px 0 0;background:linear-gradient(to top,#1d4ed8,#60a5fa);position:relative;overflow:hidden;transition:background .2s,box-shadow .2s}
.bar::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.15) 50%,transparent 60%);background-size:200% 100%;opacity:0}
.bar-val{font-size:10px;color:#94a3b8;margin-top:2px;font-weight:600}

/* Pivot: special purple with crown indicator */
.bar.pivot{background:linear-gradient(to top,#581c87,#a855f7);box-shadow:0 0 24px rgba(168,85,247,.8),0 0 8px rgba(168,85,247,1);animation:pivotGlow .8s ease-in-out infinite}
.bar.less-than{background:linear-gradient(to top,#0c4a6e,#38bdf8)}
.bar.greater-than{background:linear-gradient(to top,#7c2d12,#f97316)}
.bar.comparing{background:linear-gradient(to top,#991b1b,#ef4444);box-shadow:0 0 14px rgba(239,68,68,.6);animation:pulseBar .35s ease-in-out infinite}
.bar.swapping{background:linear-gradient(to top,#92400e,#fbbf24);box-shadow:0 0 18px rgba(251,191,36,.7)}
.bar.sorted{background:linear-gradient(to top,#065f46,#34d399);box-shadow:0 0 8px rgba(52,211,153,.2)}
.bar.sorted::after{animation:shimmer 2s linear infinite;opacity:1}
.bar.active-range{background:linear-gradient(to top,#1e3a5f,#4a6080)}
.bar.placed{animation:pivotPlace .5s ease}

/* Partition boundary indicator */
#partition-line{position:absolute;bottom:0;top:10px;width:2px;background:linear-gradient(to bottom,transparent,rgba(168,85,247,.8),transparent);box-shadow:0 0 10px rgba(168,85,247,.6);pointer-events:none;opacity:0;transition:left .2s ease,opacity .2s}

#legend{display:flex;gap:10px;padding:5px 20px;background:rgba(13,6,20,.9);font-size:.72rem;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:4px}
.leg-dot{width:10px;height:10px;border-radius:2px}

#code-panel{width:40%;background:#0d0614;border-left:1px solid #3b0764;display:flex;flex-direction:column}
.panel-title{padding:8px 14px;background:#080410;font-size:.8rem;color:#8b92c4;border-bottom:1px solid #3b0764}
#code{flex:1;overflow-y:auto;padding:10px 0;font-family:'Courier New',monospace;font-size:.78rem;line-height:1.7}
.code-line{padding:2px 14px;color:#8b92c4;white-space:pre;border-left:3px solid transparent;transition:all .2s}
.code-line.active{background:linear-gradient(90deg,rgba(251,191,36,.12),transparent);color:#fde68a;border-left-color:#fbbf24}
#explain{padding:10px 14px;background:#080c14;border-top:1px solid #3b0764;font-size:.8rem;color:#94a3b8;min-height:56px;line-height:1.5}

#controls{background:linear-gradient(135deg,#0d0614,#111827);padding:7px 14px;display:flex;align-items:center;gap:8px;border-top:1px solid #1e293b;flex-wrap:wrap;position:relative;z-index:1}
button{background:#1d4ed8;color:#e2e8f0;border:1px solid #2563eb;border-radius:6px;padding:5px 12px;cursor:pointer;font-size:.8rem;transition:all .2s}
button:hover{background:#2563eb;box-shadow:0 0 12px rgba(37,99,235,.3)}
#btn-play{background:#7e22ce;border-color:#9333ea}
#btn-play:hover{background:#9333ea;box-shadow:0 0 12px rgba(147,51,234,.4)}
#stats{display:flex;gap:10px;margin-left:auto;font-size:.78rem}
.stat{background:#1e293b;padding:3px 8px;border-radius:6px;border:1px solid #2d3748}
.stat span{color:#f59e0b;font-weight:700}
label{font-size:.75rem;color:#64748b}
input[type=range]{accent-color:#c084fc;width:80px}
select{background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:4px;padding:3px 5px;font-size:.75rem}
#depth-info{background:#1e293b;padding:3px 8px;border-radius:6px;font-size:.78rem;color:#c084fc;border:1px solid #3b0764}
.strat-btn{background:#1e293b!important;border:1px solid #334155!important;font-size:.7rem!important;padding:3px 8px!important}
.strat-btn.active-s{background:#581c87!important;border-color:#7e22ce!important;color:#d8b4fe!important}

@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
@keyframes pulseBar{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.07);transform-origin:bottom}}
@keyframes pivotGlow{0%,100%{box-shadow:0 0 16px rgba(168,85,247,.7)}50%{box-shadow:0 0 32px rgba(168,85,247,1),0 0 12px #a855f7}}
@keyframes pivotPlace{0%{transform:scaleY(1.15);transform-origin:bottom}50%{transform:scaleY(0.95)}100%{transform:scaleY(1)}}
@keyframes dropIn{0%{transform:translateY(-30px);opacity:0}100%{transform:translateY(0);opacity:1}}
</style>
</head>
<body>
<header>
  <h1>⚡ Quick Sort — Sắp xếp nhanh</h1>
  <span class="badge">Module 2</span>
  <div class="complexity">
    <div class="cx">Best: <span>O(n log n)</span></div>
    <div class="cx">Avg: <span>O(n log n)</span></div>
    <div class="cx">Worst: <span>O(n²)</span></div>
    <div class="cx">Space: <span>O(log n)</span></div>
    <div class="cx">Stable: <span>✗</span></div>
  </div>
</header>
<main>
  <div id="viz">
    <div id="bar-area">
      <div id="partition-line"></div>
      <div id="bars-container"></div>
    </div>
    <div id="legend">
      <div class="leg"><div class="leg-dot" style="background:#a855f7;box-shadow:0 0 6px #a855f7"></div>Pivot (glow)</div>
      <div class="leg"><div class="leg-dot" style="background:#38bdf8"></div>&lt; Pivot</div>
      <div class="leg"><div class="leg-dot" style="background:#f97316"></div>&gt; Pivot</div>
      <div class="leg"><div class="leg-dot" style="background:#ef4444"></div>Đang so sánh</div>
      <div class="leg"><div class="leg-dot" style="background:#fbbf24"></div>Đang swap</div>
      <div class="leg"><div class="leg-dot" style="background:#34d399"></div>Đã sắp xếp</div>
    </div>
  </div>
  <div id="code-panel">
    <div class="panel-title">📄 Code — Quick Sort (Lomuto Partition)</div>
    <div id="code"></div>
    <div id="explain">👋 Nhấn Play để bắt đầu!</div>
  </div>
</main>
<div id="controls">
  <button id="btn-play">▶ Play</button>
  <button id="btn-step">⏭ Step</button>
  <button id="btn-reset">↺ Reset</button>
  <button id="btn-new">🎲 Mảng mới</button>
  <span style="font-size:.72rem;color:#64748b">Pivot:</span>
  <button class="strat-btn active-s" id="s-last">Last</button>
  <button class="strat-btn" id="s-first">First</button>
  <button class="strat-btn" id="s-random">Random</button>
  <button class="strat-btn" id="s-mid3">Mid-of-3</button>
  <label>Tốc độ: <input type="range" id="speed" min="1" max="10" value="5"></label>
  <label>Size: <select id="size-sel">
    <option value="10">10</option><option value="16" selected>16</option>
    <option value="24">24</option><option value="32">32</option>
  </select></label>
  <div id="depth-info">Depth: 0</div>
  <div id="stats">
    <div class="stat">So sánh: <span id="s-cmp">0</span></div>
    <div class="stat">Swap: <span id="s-swap">0</span></div>
    <div class="stat">Acc: <span id="s-acc">0</span></div>
  </div>
</div>
<script>
const CODE=[
  {t:'function quickSort(arr, low, high) {'},
  {t:'  if (low >= high) return;'},
  {t:'  // Chọn pivot và phân hoạch'},
  {t:'  const pivotIdx = partition(arr, low, high);'},
  {t:'  quickSort(arr, low, pivotIdx - 1);  // trái'},
  {t:'  quickSort(arr, pivotIdx + 1, high); // phải'},
  {t:'}'},
  {t:''},
  {t:'function partition(arr, low, high) {'},
  {t:'  const pivot = arr[high]; // Lomuto: last'},
  {t:'  let i = low - 1;        // biên phần nhỏ'},
  {t:'  for (let j = low; j < high; j++) {'},
  {t:'    if (arr[j] <= pivot) {'},
  {t:'      i++;'},
  {t:'      // Swap arr[i] và arr[j]'},
  {t:'      [arr[i], arr[j]] = [arr[j], arr[i]];'},
  {t:'    }'},
  {t:'  }'},
  {t:'  // Đặt pivot vào đúng vị trí'},
  {t:'  [arr[i+1], arr[high]] = [arr[high], arr[i+1]];'},
  {t:'  return i + 1; // vị trí pivot cuối cùng'},
  {t:'}'},
];

let arr=[],steps=[],stepIdx=0,playing=false,timer=null,cmp=0,swp=0,acc=0,strategy='last';
let sortedSet=new Set(),awaitingSwap=false;

function buildCode(){document.getElementById('code').innerHTML=CODE.map((c,i)=>`<div class="code-line" data-i="${i}">${c.t||' '}</div>`).join('');}
function hl(i){document.querySelectorAll('.code-line').forEach(e=>e.classList.remove('active'));if(i>=0)document.querySelector(`[data-i="${i}"]`)?.classList.add('active');}
function genArray(){const n=+document.getElementById('size-sel').value;arr=Array.from({length:n},()=>Math.floor(Math.random()*85)+15);}

function choosePivot(a,low,high){
  if(strategy==='last') return high;
  if(strategy==='first') return low;
  if(strategy==='random') return low+Math.floor(Math.random()*(high-low+1));
  const mid=Math.floor((low+high)/2);
  const vals=[[a[low],low],[a[mid],mid],[a[high],high]].sort((x,y)=>x[0]-y[0]);
  return vals[1][1];
}

function buildSteps(){
  steps=[];sortedSet=new Set();
  const a=[...arr];
  steps.push({type:'init',arr:[...a],line:-1});
  function qs(ar,low,high,depth){
    if(low>=high){if(low===high)sortedSet.add(low);steps.push({type:'base',low,high,depth,arr:[...ar],line:1});return;}
    const pivIdx=choosePivot(ar,low,high);
    if(pivIdx!==high){[ar[pivIdx],ar[high]]=[ar[high],ar[pivIdx]];steps.push({type:'pivotMove',pivIdx,high,arr:[...ar],depth,low,line:9});}
    const pivot=ar[high];
    steps.push({type:'partition_start',pivot,pivotAt:high,low,high,depth,arr:[...ar],line:9});
    let i=low-1;
    for(let j=low;j<high;j++){
      cmp++;acc+=2;
      steps.push({type:'compare',j,i,pivot,pivotAt:high,low,high,depth,arr:[...ar],line:12});
      if(ar[j]<=pivot){
        i++;
        if(i!==j){swp++;acc+=2;[ar[i],ar[j]]=[ar[j],ar[i]];steps.push({type:'swap',i,j,pivotAt:high,low,high,depth,arr:[...ar],line:15});}
        else steps.push({type:'inc_i',i,j,pivotAt:high,low,high,depth,arr:[...ar],line:13});
      }else{
        steps.push({type:'skip',j,i,pivotAt:high,low,high,depth,arr:[...ar],line:12});
      }
    }
    swp++;acc+=2;[ar[i+1],ar[high]]=[ar[high],ar[i+1]];
    const finalPivot=i+1;
    sortedSet.add(finalPivot);
    steps.push({type:'place_pivot',finalPivot,low,high,depth,arr:[...ar],line:19});
    qs(ar,low,finalPivot-1,depth+1);
    qs(ar,finalPivot+1,high,depth+1);
  }
  qs(a,0,a.length-1,0);
  for(let k=0;k<a.length;k++) sortedSet.add(k);
  steps.push({type:'done',arr:[...a]});
  cmp=0;swp=0;acc=0;sortedSet=new Set();
}

function buildBarsDOM(a){
  const con=document.getElementById('bars-container');
  con.innerHTML='';
  const max=Math.max(...a);
  a.forEach((v,i)=>{
    const wrap=document.createElement('div');wrap.className='bar-wrap';wrap.dataset.idx=i;
    const bar=document.createElement('div');bar.className='bar';
    bar.style.height=Math.round((v/max)*100)+'%';
    bar.style.animation='dropIn .4s ease both';
    bar.style.animationDelay=(i*0.02)+'s';
    const val=document.createElement('div');val.className='bar-val';val.textContent=v;
    wrap.appendChild(bar);wrap.appendChild(val);con.appendChild(wrap);
  });
}

function updateBars(state){
  const wraps=document.querySelectorAll('.bar-wrap');
  const a=state.arr||arr;
  const max=Math.max(...a);
  const {low,high,pivotAt,i:iPtr,j:jPtr}=state;
  const pLine=document.getElementById('partition-line');

  // Show partition boundary
  if(iPtr!==undefined&&iPtr>=0&&low!==undefined){
    const barW=document.getElementById('bars-container').clientWidth/wraps.length;
    pLine.style.left=((iPtr+1)*barW+20-1)+'px';
    pLine.style.opacity='0.8';
  } else {
    pLine.style.opacity='0';
  }

  wraps.forEach((wrap,idx)=>{
    const bar=wrap.querySelector('.bar');
    const val=wrap.querySelector('.bar-val');
    bar.className='bar';
    bar.style.height=Math.round((a[idx]/max)*100)+'%';
    val.textContent=a[idx];

    if(state.type==='done') bar.classList.add('sorted');
    else if(sortedSet.has(idx)) bar.classList.add('sorted');
    else if(state.swapIdxs&&state.swapIdxs.includes(idx)) bar.classList.add('swapping');
    else if(idx===pivotAt) bar.classList.add('pivot');
    else if(idx===jPtr) bar.classList.add('comparing');
    else if(low!==undefined&&high!==undefined&&idx>=low&&idx<=high){
      if(iPtr!==undefined&&idx<=iPtr) bar.classList.add('less-than');
      else bar.classList.add('active-range');
    }
  });
}

function animateSwap(i1,i2,callback){
  const wraps=document.querySelectorAll('.bar-wrap');
  const bar1=wraps[i1],bar2=wraps[i2];
  if(!bar1||!bar2){callback&&callback();return;}
  const dx=bar2.offsetLeft-bar1.offsetLeft;
  const dur=Math.max(120,380-document.getElementById('speed').value*30);
  bar1.style.transition=`transform ${dur}ms cubic-bezier(0.4,0,0.2,1)`;
  bar2.style.transition=`transform ${dur}ms cubic-bezier(0.4,0,0.2,1)`;
  bar1.style.transform=`translateX(${dx}px)`;
  bar2.style.transform=`translateX(${-dx}px)`;
  bar1.style.zIndex=2;bar2.style.zIndex=1;
  setTimeout(()=>{
    bar1.style.transition='none';bar2.style.transition='none';
    bar1.style.transform='';bar2.style.transform='';
    bar1.style.zIndex='';bar2.style.zIndex='';
    const parent=bar1.parentNode;
    if(i1<i2) parent.insertBefore(bar2,bar1);
    else parent.insertBefore(bar1,bar2.nextSibling);
    callback&&callback();
  },dur+20);
}

function applyStep(s){
  if(!s)return;
  hl(s.line>=0?s.line:-1);
  if(s.depth!==undefined) document.getElementById('depth-info').textContent=`Depth: ${s.depth}`;

  if(s.type==='init'){
    buildBarsDOM(s.arr);
    document.getElementById('partition-line').style.opacity='0';
    document.getElementById('explain').textContent='Quick Sort: Chọn pivot → phân hoạch → đệ quy. Pivot luôn về đúng vị trí sau partition.';
  }
  else if(s.type==='base'){
    updateBars(s);
    document.getElementById('explain').innerHTML=`📌 Base case: low=${s.low}≥high=${s.high} → đã sắp xếp!`;
    document.getElementById('partition-line').style.opacity='0';
  }
  else if(s.type==='pivotMove'){
    document.getElementById('explain').innerHTML=`🔀 Di chuyển pivot từ vị trí ${s.pivIdx} → ${s.high}`;
    awaitingSwap=true;
    if(playing) stopPlay();
    updateBars({...s,swapIdxs:[s.pivIdx,s.high]});
    animateSwap(s.pivIdx,s.high,()=>{
      awaitingSwap=false;
      updateBars(s);
      if(playing) continuePlay();
    });
    return;
  }
  else if(s.type==='partition_start'){
    document.getElementById('explain').innerHTML=`🟣 <b>Pivot = ${s.pivot}</b> (vị trí ${s.pivotAt}). Phân hoạch [${s.low}..${s.high}].`;
    updateBars(s);
  }
  else if(s.type==='compare'){
    cmp++;document.getElementById('s-cmp').textContent=cmp;
    acc+=2;document.getElementById('s-acc').textContent=acc;
    document.getElementById('explain').innerHTML=`🔴 arr[${s.j}]=${s.arr[s.j]} ≤ pivot=${s.pivot}? → <b>${s.arr[s.j]<=s.pivot?'✓ swap vào vùng ≤':'✗ bỏ qua, ở phải'}</b>`;
    updateBars(s);
  }
  else if(s.type==='swap'){
    swp++;document.getElementById('s-swap').textContent=swp;
    acc+=2;document.getElementById('s-acc').textContent=acc;
    document.getElementById('explain').innerHTML=`🔄 Swap arr[${s.i}] ↔ arr[${s.j}]`;
    awaitingSwap=true;
    if(playing) stopPlay();
    updateBars({...s,swapIdxs:[s.i,s.j]});
    animateSwap(s.i,s.j,()=>{
      awaitingSwap=false;
      updateBars(s);
      if(playing) continuePlay();
    });
    return;
  }
  else if(s.type==='inc_i'){
    document.getElementById('explain').innerHTML=`✅ arr[${s.j}] ≤ pivot, i++ = ${s.i}`;
    updateBars(s);
  }
  else if(s.type==='skip'){
    document.getElementById('explain').innerHTML=`⏩ arr[${s.j}]=${s.arr[s.j]} > pivot=${s.pivot}, keep right`;
    updateBars(s);
  }
  else if(s.type==='place_pivot'){
    swp++;document.getElementById('s-swap').textContent=swp;
    acc+=2;document.getElementById('s-acc').textContent=acc;
    sortedSet.add(s.finalPivot);
    document.getElementById('explain').innerHTML=`📍 Pivot đặt vào <b>vị trí ${s.finalPivot}</b>. Pivot đã ở đúng chỗ mãi mãi!`;
    document.getElementById('partition-line').style.opacity='0';
    awaitingSwap=true;
    if(playing) stopPlay();
    updateBars({...s,swapIdxs:[s.finalPivot,s.high]});
    animateSwap(s.finalPivot,s.high,()=>{
      awaitingSwap=false;
      // flash pivot bar
      const wraps=document.querySelectorAll('.bar-wrap');
      const bar=wraps[s.finalPivot]?.querySelector('.bar');
      if(bar){bar.style.animation='none';bar.offsetHeight;bar.style.animation='pivotPlace .5s ease';}
      updateBars(s);
      if(playing) continuePlay();
    });
    return;
  }
  else if(s.type==='done'){
    buildBarsDOM(s.arr);
    setTimeout(()=>document.querySelectorAll('.bar').forEach(b=>b.classList.add('sorted')),50);
    document.getElementById('explain').textContent='🎉 Quick Sort hoàn tất! In-place, cache-friendly, nhanh trong thực tế.';
    document.getElementById('partition-line').style.opacity='0';
    stopPlay();
  }
}

function getDelay(){return Math.round(1100-document.getElementById('speed').value*100);}
function continuePlay(){playing=true;document.getElementById('btn-play').textContent='⏸ Pause';tick();}
function tick(){if(awaitingSwap)return;if(stepIdx>=steps.length){stopPlay();return;}applyStep(steps[stepIdx++]);if(playing&&!awaitingSwap)timer=setTimeout(tick,getDelay());}
function startPlay(){if(stepIdx>=steps.length)reset();playing=true;document.getElementById('btn-play').textContent='⏸ Pause';tick();}
function stopPlay(){playing=false;clearTimeout(timer);document.getElementById('btn-play').textContent='▶ Play';}
function reset(){
  stopPlay();awaitingSwap=false;stepIdx=0;cmp=0;swp=0;acc=0;sortedSet=new Set();
  buildSteps();
  ['s-cmp','s-swap','s-acc'].forEach(id=>document.getElementById(id).textContent=0);
  document.getElementById('depth-info').textContent='Depth: 0';
  document.getElementById('partition-line').style.opacity='0';
  hl(-1);buildBarsDOM(arr);
  document.getElementById('explain').textContent='👋 Nhấn Play để bắt đầu!';
}

function setStrategy(s){strategy=s;document.querySelectorAll('.strat-btn').forEach(b=>b.classList.remove('active-s'));document.getElementById('s-'+s).classList.add('active-s');genArray();reset();}

document.getElementById('btn-play').onclick=()=>playing?stopPlay():startPlay();
document.getElementById('btn-step').onclick=()=>{stopPlay();if(!awaitingSwap&&stepIdx<steps.length)applyStep(steps[stepIdx++]);};
document.getElementById('btn-reset').onclick=reset;
document.getElementById('btn-new').onclick=()=>{genArray();reset();};
['last','first','random','mid3'].forEach(s=>document.getElementById('s-'+s).onclick=()=>setStrategy(s));
document.getElementById('size-sel').onchange=()=>{genArray();reset();};

buildCode();genArray();reset();
</script>
</body>
</html>
