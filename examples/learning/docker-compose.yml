# =============================================================
# Docker Compose for the learning project.
#
# Starts MongoDB and Redis -- the two infrastructure services
# your app needs. Run with:
#
#   docker-compose up -d
#
# Stop with:
#
#   docker-compose down
#
# To wipe all data and start fresh:
#
#   docker-compose down -v
# =============================================================

version: '3.8'

services:
  mongodb:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  mongo-data:
