version: '3.8'

services:
  app:
    build: ../../   # build from examples/learning/
    ports:
      - '3000:3000'
    depends_on:
      - mongodb
      - redis
    environment:
      MONGO_URI: mongodb://mongodb:27017/learning
      REDIS_URL: redis://redis:6379
      JWT_SECRET: docker-secret-change-in-production
      JWT_REFRESH_SECRET: docker-refresh-secret
      PORT: '3000'
    restart: unless-stopped

  mongodb:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  mongo-data:
