version: '3.8'

services:
  api-gateway:
    build: ./api-gateway
    ports:
      - '3000:3000'
    depends_on:
      - order-service
      - product-service
    environment:
      JWT_SECRET: dev-secret-change-in-production
      ORDER_SERVICE_URL: order-service:5000
      PRODUCT_SERVICE_URL: product-service:5000

  order-service:
    build: ./order-service
    ports:
      - '3001:3001'
      - '5001:5000'
    depends_on:
      - mongodb
      - redis
    environment:
      MONGO_URI: mongodb://mongodb:27017/orders
      REDIS_URL: redis://redis:6379

  product-service:
    build: ./product-service
    ports:
      - '3002:3002'
      - '5002:5000'
    depends_on:
      - mongodb
      - redis
    environment:
      MONGO_URI: mongodb://mongodb:27017/products
      REDIS_URL: redis://redis:6379

  mongodb:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  mongo-data:
