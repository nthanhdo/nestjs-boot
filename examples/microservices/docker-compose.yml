version: '3.8'

services:
  api-gateway:
    build: ./api-gateway
    ports:
      - '3000:3000'
    depends_on:
      - auth-service
      - order-service
      - product-service
      - notification-service
      - file-service
      - scheduler-service
      - blog-service
      - fulfillment-service
      - campaign-service
    environment:
      JWT_SECRET: dev-secret-change-in-production
      AUTH_SERVICE_URL: auth-service:5000
      ORDER_SERVICE_URL: order-service:5000
      PRODUCT_SERVICE_URL: product-service:5000
      NOTIFICATION_SERVICE_URL: notification-service:5000
      FILE_SERVICE_URL: file-service:5005
      SCHEDULER_SERVICE_URL: scheduler-service:5006
      BLOG_SERVICE_URL: blog-service:5007
      FULFILLMENT_SERVICE_URL: fulfillment-service:5008
      CAMPAIGN_SERVICE_URL: campaign-service:5009

  auth-service:
    build: ./auth-service
    ports:
      - '3003:3003'
      - '5001:5000'
    depends_on:
      - mongodb
    environment:
      MONGO_URI: mongodb://mongodb:27017/auth
      JWT_SECRET: dev-secret-change-in-production
      JWT_REFRESH_SECRET: dev-refresh-secret

  order-service:
    build: ./order-service
    ports:
      - '3001:3001'
      - '5003:5000'
    depends_on:
      - mongodb
      - redis
    environment:
      MONGO_URI: mongodb://mongodb:27017/orders
      REDIS_URL: redis://redis:6379

  product-service:
    build: ./product-service
    ports:
      - '3002:3002'
      - '5002:5000'
    depends_on:
      - mongodb
      - redis
    environment:
      MONGO_URI: mongodb://mongodb:27017/products
      REDIS_URL: redis://redis:6379

  notification-service:
    build: ./notification-service
    ports:
      - '3004:3004'
      - '5004:5000'
    depends_on:
      - mongodb
      - redis
    environment:
      MONGO_URI: mongodb://mongodb:27017/notifications
      REDIS_URL: redis://redis:6379

  file-service:
    build: ./file-service
    ports:
      - '3005:3005'
      - '5005:5005'
    depends_on:
      - mongodb
    environment:
      MONGO_URI: mongodb://mongodb:27017/files
      FILE_BASE_URL: http://localhost:3005/files
    volumes:
      - file-uploads:/app/uploads

  scheduler-service:
    build: ./scheduler-service
    ports:
      - '3006:3006'
      - '5006:5006'
    depends_on:
      - mongodb
      - redis
    environment:
      MONGO_URI: mongodb://mongodb:27017/scheduler
      REDIS_URL: redis://redis:6379

  blog-service:
    build: ./blog-service
    ports:
      - '3007:3007'
      - '5007:5007'
    depends_on:
      - mongodb
      - redis
    environment:
      MONGO_URI: mongodb://mongodb:27017/blog
      REDIS_URL: redis://redis:6379

  fulfillment-service:
    build: ./fulfillment-service
    ports:
      - '3008:3008'
      - '5008:5008'
    depends_on:
      - mongodb
      - redis
    environment:
      MONGO_URI: mongodb://mongodb:27017/fulfillment
      REDIS_URL: redis://redis:6379

  campaign-service:
    build: ./campaign-service
    ports:
      - '3009:3009'
      - '5009:5009'
    depends_on:
      - mongodb
      - redis
    environment:
      MONGO_URI: mongodb://mongodb:27017/campaigns
      REDIS_URL: redis://redis:6379

  mongodb:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  mongo-data:
  file-uploads:
