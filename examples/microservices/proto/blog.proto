syntax = "proto3";
package blog;

service BlogService {
  rpc CreateArticle (CreateArticleRequest) returns (Article);
  rpc UpdateArticle (UpdateArticleRequest) returns (Article);
  rpc GetArticle (ArticleBySlug) returns (Article);
  rpc ListArticles (ListArticlesRequest) returns (ArticleListResponse);
  rpc DeleteArticle (ArticleById) returns (DeleteResponse);
  rpc ListCategories (Empty) returns (CategoryListResponse);
  rpc ListTags (Empty) returns (TagListResponse);
}

message Article {
  string id = 1;
  string title = 2;
  string slug = 3;
  string content = 4;
  string excerpt = 5;
  string author = 6;
  string category = 7;
  repeated string tags = 8;
  string status = 9;
  string coverImage = 10;
  SEOMeta seo = 11;
  string createdAt = 12;
  string updatedAt = 13;
  int32 viewCount = 14;
}

message SEOMeta {
  string metaTitle = 1;
  string metaDescription = 2;
  string canonicalUrl = 3;
  string ogImage = 4;
}

message CreateArticleRequest {
  string title = 1;
  string content = 2;
  string excerpt = 3;
  string author = 4;
  string category = 5;
  repeated string tags = 6;
  string coverImage = 7;
  SEOMeta seo = 8;
  string status = 9;
}

message UpdateArticleRequest {
  string id = 1;
  string title = 2;
  string content = 3;
  string excerpt = 4;
  string category = 5;
  repeated string tags = 6;
  string coverImage = 7;
  SEOMeta seo = 8;
  string status = 9;
}

message ArticleBySlug { string slug = 1; }
message ArticleById { string id = 1; }

message ListArticlesRequest {
  string category = 1;
  string tag = 2;
  string status = 3;
  string search = 4;
  int32 page = 5;
  int32 limit = 6;
}

message ArticleListResponse {
  repeated Article items = 1;
  int32 total = 2;
}

message CategoryListResponse { repeated string categories = 1; }
message TagListResponse { repeated string tags = 1; }
message DeleteResponse { bool success = 1; }
message Empty {}
