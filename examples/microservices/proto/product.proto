syntax = "proto3";

package product;

service ProductService {
  rpc FindOne (ProductById) returns (Product);
  rpc FindAll (ProductFilter) returns (ProductList);
  rpc Create (CreateProductRequest) returns (Product);
}

message Product {
  string id = 1;
  string name = 2;
  double price = 3;
  string category = 4;
  int32 stock = 5;
}

message ProductById {
  string id = 1;
}

message ProductFilter {
  string category = 1;
  int32 page = 2;
  int32 limit = 3;
}

message ProductList {
  repeated Product items = 1;
  int32 total = 2;
}

message CreateProductRequest {
  string name = 1;
  double price = 2;
  string category = 3;
  int32 stock = 4;
}
