<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API Test Report</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 2rem; background: #0d1117; color: #c9d1d9; }
  h1 { color: #58a6ff; margin-bottom: 0.5rem; }
  h2 { color: #c9d1d9; margin: 1.5rem 0 0.5rem; }
  p { color: #8b949e; margin-bottom: 1rem; }
  table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
  th, td { border: 1px solid #30363d; padding: 8px 12px; text-align: left; font-size: 0.9rem; }
  th { background: #161b22; color: #c9d1d9; }
  tr:hover { background: #161b22; }
  .pass { color: #3fb950; }
  .fail { color: #f85149; }
  tr.pass td:nth-child(5) { color: #3fb950; font-weight: bold; }
  tr.fail td:nth-child(5) { color: #f85149; font-weight: bold; }
  .summary { display: flex; gap: 1.5rem; margin: 1rem 0 2rem; flex-wrap: wrap; }
  .stat { background: #161b22; padding: 1rem 2rem; border-radius: 8px; border: 1px solid #30363d; min-width: 120px; }
  .stat .label { color: #8b949e; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .stat .value { font-size: 1.8rem; font-weight: bold; margin-top: 0.25rem; }
</style>
</head>
<body>
<h1>API Test Report</h1>
<p>Generated: {{TIMESTAMP}}</p>
<div class="summary">
  <div class="stat"><div class="label">Total</div><div class="value">{{TOTAL}}</div></div>
  <div class="stat"><div class="label">Passed</div><div class="value pass">{{PASSED}}</div></div>
  <div class="stat"><div class="label">Failed</div><div class="value fail">{{FAILED}}</div></div>
  <div class="stat"><div class="label">Pass Rate</div><div class="value">{{RATE}}%</div></div>
</div>
<h2>By Category</h2>
<table>
  <tr><th>Category</th><th>Total</th><th>Passed</th><th>Failed</th></tr>
  {{CATEGORY_ROWS}}
</table>
<h2>All Tests</h2>
<table>
  <tr><th>Test</th><th>Category</th><th>Expected Status</th><th>Actual Status</th><th>Result</th><th>Reason</th></tr>
  {{TEST_ROWS}}
</table>
</body>
</html>
