<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Service — Demo UI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #1a1a2e; line-height: 1.6; }
    .app { display: flex; min-height: 100vh; }
    .sidebar { width: 240px; background: #1a1a2e; color: #e0e0e0; padding: 20px 0; flex-shrink: 0; }
    .sidebar h1 { font-size: 16px; padding: 0 20px 20px; border-bottom: 1px solid #2d2d44; color: #fff; }
    .sidebar h1 small { display: block; font-size: 11px; color: #8888aa; font-weight: normal; margin-top: 2px; }
    .sidebar nav a { display: block; padding: 10px 20px; color: #b0b0cc; text-decoration: none; font-size: 14px; transition: all .15s; }
    .sidebar nav a:hover, .sidebar nav a.active { background: #2d2d44; color: #fff; }
    .main { flex: 1; padding: 30px; max-width: 1100px; }
    .main h2 { font-size: 22px; margin-bottom: 20px; }
    .card { background: #fff; border-radius: 8px; padding: 24px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .card h3 { font-size: 16px; margin-bottom: 16px; color: #333; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #eee; }
    th { font-weight: 600; color: #666; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
    tr:hover td { background: #f9fafb; }
    .btn { display: inline-block; padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all .15s; }
    .btn-primary { background: #4361ee; color: #fff; }
    .btn-primary:hover { background: #3a56d4; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn-danger { background: #e63946; color: #fff; }
    .btn-success { background: #2a9d8f; color: #fff; }
    .btn-outline { background: transparent; border: 1px solid #ddd; color: #555; }
    .btn-outline:hover { border-color: #4361ee; color: #4361ee; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
    .badge-draft { background: #e9ecef; color: #495057; }
    .badge-published { background: #d4edda; color: #155724; }
    .badge-approved { background: #cce5ff; color: #004085; }
    .badge-scheduled { background: #fff3cd; color: #856404; }
    .badge-rejected { background: #f8d7da; color: #721c24; }
    .badge-archived { background: #d6d8db; color: #383d41; }
    input, select, textarea { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; font-family: inherit; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #4361ee; box-shadow: 0 0 0 3px rgba(67,97,238,.1); }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 4px; font-size: 13px; font-weight: 500; color: #555; }
    .form-row { display: flex; gap: 16px; }
    .form-row > * { flex: 1; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .empty { text-align: center; padding: 40px; color: #999; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 100; align-items: center; justify-content: center; }
    .modal-overlay.show { display: flex; }
    .modal { background: #fff; border-radius: 12px; padding: 28px; width: 560px; max-height: 80vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
    .modal h3 { margin-bottom: 20px; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
    #toast { display: none; position: fixed; bottom: 24px; right: 24px; background: #1a1a2e; color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 14px; z-index: 200; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
    #toast.show { display: block; }
    .field-list { margin: 12px 0; }
    .field-item { display: flex; align-items: center; gap: 8px; padding: 8px; background: #f8f9fa; border-radius: 6px; margin-bottom: 6px; font-size: 13px; }
    .field-item .name { font-weight: 600; min-width: 120px; }
    .field-item .type { color: #4361ee; }
    .field-item .remove { cursor: pointer; color: #e63946; margin-left: auto; }
    .stats { display: flex; gap: 20px; margin-bottom: 24px; }
    .stat-card { background: #fff; border-radius: 8px; padding: 20px; flex: 1; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .stat-card .value { font-size: 28px; font-weight: 700; color: #1a1a2e; }
    .stat-card .label { font-size: 13px; color: #888; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="app">
    <div class="sidebar">
      <h1>Content Service <small>nestjs-boot Demo UI</small></h1>
      <nav>
        <a href="#" data-page="dashboard" class="active">Dashboard</a>
        <a href="#" data-page="types">Content Types</a>
        <a href="#" data-page="entries">Entries</a>
        <a href="#" data-page="assets">Assets</a>
        <a href="#" data-page="locales">Locales</a>
        <a href="#" data-page="webhooks">Webhooks</a>
        <a href="#" data-page="api-keys">API Keys</a>
      </nav>
    </div>
    <div class="main" id="content">
      <!-- Dynamic content loaded here -->
    </div>
  </div>

  <!-- Create Content Type Modal -->
  <div class="modal-overlay" id="createTypeModal">
    <div class="modal">
      <h3>Create Content Type</h3>
      <div class="form-group">
        <label>Name</label>
        <input type="text" id="typeName" placeholder="e.g. Blog Post">
      </div>
      <div class="form-group">
        <label>Slug</label>
        <input type="text" id="typeSlug" placeholder="e.g. blog-post">
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="typeDescription" rows="2" placeholder="Optional description"></textarea>
      </div>
      <h4 style="margin: 16px 0 8px; font-size: 14px;">Fields</h4>
      <div id="fieldList" class="field-list"></div>
      <div class="form-row">
        <div class="form-group">
          <input type="text" id="newFieldName" placeholder="Field name">
        </div>
        <div class="form-group">
          <select id="newFieldType">
            <option value="text">Text</option>
            <option value="textarea">Textarea</option>
            <option value="richtext">Rich Text</option>
            <option value="number">Number</option>
            <option value="boolean">Boolean</option>
            <option value="date">Date</option>
            <option value="datetime">DateTime</option>
            <option value="media">Media</option>
            <option value="reference">Reference</option>
            <option value="json">JSON</option>
            <option value="enum">Enum</option>
            <option value="slug">Slug</option>
            <option value="url">URL</option>
            <option value="email">Email</option>
          </select>
        </div>
        <div>
          <button class="btn btn-outline" onclick="addField()">+ Add</button>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeModal('createTypeModal')">Cancel</button>
        <button class="btn btn-primary" onclick="createContentType()">Create</button>
      </div>
    </div>
  </div>

  <!-- Create Entry Modal -->
  <div class="modal-overlay" id="createEntryModal">
    <div class="modal">
      <h3>Create Entry</h3>
      <div class="form-group">
        <label>Content Type</label>
        <select id="entryTypeSelect" onchange="loadEntryForm()"></select>
      </div>
      <div class="form-group">
        <label>Locale</label>
        <select id="entryLocale">
          <option value="en">English</option>
          <option value="vi">Vietnamese</option>
        </select>
      </div>
      <div id="entryFormFields"></div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeModal('createEntryModal')">Cancel</button>
        <button class="btn btn-primary" onclick="createEntry()">Create</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    const API = '/api/content';
    let contentTypes = [];
    let currentPage = 'dashboard';
    let pendingFields = [];

    // --- Navigation ---
    document.querySelectorAll('.sidebar nav a').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        document.querySelectorAll('.sidebar nav a').forEach(n => n.classList.remove('active'));
        a.classList.add('active');
        currentPage = a.dataset.page;
        loadPage(currentPage);
      });
    });

    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    function openModal(id) { document.getElementById(id).classList.add('show'); }
    function closeModal(id) { document.getElementById(id).classList.remove('show'); }

    function statusBadge(status) {
      const cls = {
        DRAFT: 'badge-draft', PUBLISHED: 'badge-published', APPROVED: 'badge-approved',
        SCHEDULED: 'badge-scheduled', REJECTED: 'badge-rejected', ARCHIVED: 'badge-archived',
        UNPUBLISHED: 'badge-draft',
      }[status] || 'badge-draft';
      return `<span class="badge ${cls}">${status}</span>`;
    }

    // --- API helpers ---
    async function api(path, opts = {}) {
      try {
        const res = await fetch(API + path, {
          headers: { 'Content-Type': 'application/json', ...opts.headers },
          ...opts,
        });
        if (res.status === 204) return null;
        return res.json();
      } catch (e) {
        toast('API Error: ' + e.message);
        return null;
      }
    }

    // --- Pages ---
    async function loadPage(page) {
      const el = document.getElementById('content');
      switch (page) {
        case 'dashboard': return loadDashboard(el);
        case 'types': return loadTypes(el);
        case 'entries': return loadEntries(el);
        case 'assets': return loadAssets(el);
        case 'locales': return loadLocales(el);
        case 'webhooks': return loadWebhooks(el);
        case 'api-keys': return loadApiKeys(el);
      }
    }

    async function loadDashboard(el) {
      const types = await api('/types') || [];
      const entries = await api('/entries') || { data: [], meta: { total: 0 } };
      contentTypes = types;
      el.innerHTML = `
        <h2>Dashboard</h2>
        <div class="stats">
          <div class="stat-card"><div class="value">${types.length}</div><div class="label">Content Types</div></div>
          <div class="stat-card"><div class="value">${entries.meta?.total ?? entries.length ?? 0}</div><div class="label">Entries</div></div>
        </div>
        <div class="card">
          <h3>Quick Actions</h3>
          <button class="btn btn-primary" onclick="pendingFields=[];document.getElementById('fieldList').innerHTML='';openModal('createTypeModal')">+ New Content Type</button>
          <button class="btn btn-success" style="margin-left:8px" onclick="openCreateEntry()">+ New Entry</button>
        </div>
        <div class="card">
          <h3>Recent Entries</h3>
          ${(entries.data?.length) ? `
            <table>
              <thead><tr><th>ID</th><th>Type</th><th>Locale</th><th>Status</th><th>Updated</th></tr></thead>
              <tbody>${entries.data.slice(0, 10).map(e => `
                <tr>
                  <td style="font-family:monospace;font-size:12px">${e.id.slice(0, 8)}...</td>
                  <td>${e.contentTypeId.slice(0, 8)}...</td>
                  <td>${e.locale}</td>
                  <td>${statusBadge(e.status)}</td>
                  <td>${new Date(e.updatedAt).toLocaleDateString()}</td>
                </tr>`).join('')}
              </tbody>
            </table>` : '<div class="empty">No entries yet. Create a content type first, then add entries.</div>'}
        </div>`;
    }

    async function loadTypes(el) {
      const types = await api('/types') || [];
      contentTypes = types;
      el.innerHTML = `
        <div class="toolbar">
          <h2>Content Types</h2>
          <button class="btn btn-primary" onclick="pendingFields=[];document.getElementById('fieldList').innerHTML='';openModal('createTypeModal')">+ New Type</button>
        </div>
        ${types.length ? `<div class="card"><table>
          <thead><tr><th>Name</th><th>Slug</th><th>Fields</th><th>Created</th><th>Actions</th></tr></thead>
          <tbody>${types.map(t => {
            const fields = Array.isArray(t.fields) ? t.fields : (typeof t.fields === 'string' ? JSON.parse(t.fields) : []);
            return `<tr>
              <td><strong>${t.name}</strong></td>
              <td style="font-family:monospace">${t.slug}</td>
              <td>${fields.length} fields</td>
              <td>${new Date(t.createdAt).toLocaleDateString()}</td>
              <td><button class="btn btn-sm btn-danger" onclick="deleteType('${t.id}')">Delete</button></td>
            </tr>`;
          }).join('')}</tbody>
        </table></div>` : '<div class="card empty">No content types yet. Click "+ New Type" to create one.</div>'}`;
    }

    async function loadEntries(el) {
      const result = await api('/entries') || { data: [], meta: { total: 0 } };
      const entries = result.data || [];
      el.innerHTML = `
        <div class="toolbar">
          <h2>Entries</h2>
          <button class="btn btn-success" onclick="openCreateEntry()">+ New Entry</button>
        </div>
        ${entries.length ? `<div class="card"><table>
          <thead><tr><th>Slug</th><th>Locale</th><th>Status</th><th>Version</th><th>Updated</th><th>Actions</th></tr></thead>
          <tbody>${entries.map(e => `
            <tr>
              <td>${e.slug || '-'}</td>
              <td>${e.locale}</td>
              <td>${statusBadge(e.status)}</td>
              <td>v${e.version}</td>
              <td>${new Date(e.updatedAt).toLocaleDateString()}</td>
              <td>
                ${e.status === 'DRAFT' ? `<button class="btn btn-sm btn-primary" onclick="approveEntry('${e.id}')">Approve</button>` : ''}
                ${e.status === 'APPROVED' ? `<button class="btn btn-sm btn-success" onclick="publishEntry('${e.id}')">Publish</button>` : ''}
                ${e.status === 'PUBLISHED' ? `<button class="btn btn-sm btn-outline" onclick="unpublishEntry('${e.id}')">Unpublish</button>` : ''}
                <button class="btn btn-sm btn-danger" onclick="deleteEntry('${e.id}')">Delete</button>
              </td>
            </tr>`).join('')}
          </tbody>
        </table></div>` : '<div class="card empty">No entries yet.</div>'}`;
    }

    async function loadAssets(el) {
      const result = await api('/assets') || { data: [] };
      const assets = result.data || [];
      el.innerHTML = `
        <div class="toolbar"><h2>Assets</h2></div>
        ${assets.length ? `<div class="card"><table>
          <thead><tr><th>Filename</th><th>Type</th><th>Size</th><th>Folder</th><th>Created</th></tr></thead>
          <tbody>${assets.map(a => `<tr>
            <td>${a.filename}</td><td>${a.mimeType}</td>
            <td>${(Number(a.size) / 1024).toFixed(1)} KB</td>
            <td>${a.folder || '-'}</td>
            <td>${new Date(a.createdAt).toLocaleDateString()}</td>
          </tr>`).join('')}</tbody>
        </table></div>` : '<div class="card empty">No assets uploaded yet.</div>'}`;
    }

    async function loadLocales(el) {
      const locales = await api('/locales') || [];
      el.innerHTML = `
        <div class="toolbar"><h2>Locales</h2></div>
        <div class="card"><table>
          <thead><tr><th>Code</th><th>Name</th><th>Default</th><th>Fallback</th></tr></thead>
          <tbody>${locales.map(l => `<tr>
            <td style="font-family:monospace">${l.code}</td><td>${l.name}</td>
            <td>${l.isDefault ? 'Yes' : '-'}</td><td>${l.fallbackLocale || '-'}</td>
          </tr>`).join('')}</tbody>
        </table></div>`;
    }

    async function loadWebhooks(el) {
      const hooks = await api('/webhooks') || [];
      el.innerHTML = `
        <div class="toolbar"><h2>Webhooks</h2></div>
        ${hooks.length ? `<div class="card"><table>
          <thead><tr><th>URL</th><th>Events</th><th>Active</th></tr></thead>
          <tbody>${hooks.map(h => `<tr>
            <td style="font-family:monospace;font-size:12px">${h.url}</td>
            <td>${h.events.join(', ')}</td>
            <td>${h.active ? '<span class="badge badge-published">Active</span>' : '<span class="badge badge-draft">Inactive</span>'}</td>
          </tr>`).join('')}</tbody>
        </table></div>` : '<div class="card empty">No webhooks configured.</div>'}`;
    }

    async function loadApiKeys(el) {
      const keys = await api('/api-keys') || [];
      el.innerHTML = `
        <div class="toolbar"><h2>API Keys</h2></div>
        ${keys.length ? `<div class="card"><table>
          <thead><tr><th>Name</th><th>Environment</th><th>Created</th></tr></thead>
          <tbody>${keys.map(k => `<tr>
            <td>${k.name}</td><td>${k.environment}</td>
            <td>${new Date(k.createdAt).toLocaleDateString()}</td>
          </tr>`).join('')}</tbody>
        </table></div>` : '<div class="card empty">No API keys. Create one via the Management API.</div>'}`;
    }

    // --- Content Type CRUD ---
    function addField() {
      const name = document.getElementById('newFieldName').value.trim();
      const type = document.getElementById('newFieldType').value;
      if (!name) return toast('Field name is required');
      if (pendingFields.some(f => f.name === name)) return toast('Duplicate field name');
      pendingFields.push({ name, label: name.charAt(0).toUpperCase() + name.slice(1), type });
      renderFields();
      document.getElementById('newFieldName').value = '';
    }

    function removeField(idx) {
      pendingFields.splice(idx, 1);
      renderFields();
    }

    function renderFields() {
      document.getElementById('fieldList').innerHTML = pendingFields.map((f, i) =>
        `<div class="field-item">
          <span class="name">${f.name}</span>
          <span class="type">${f.type}</span>
          <span class="remove" onclick="removeField(${i})">x</span>
        </div>`
      ).join('');
    }

    async function createContentType() {
      const name = document.getElementById('typeName').value.trim();
      const slug = document.getElementById('typeSlug').value.trim();
      const description = document.getElementById('typeDescription').value.trim();
      if (!name || !slug) return toast('Name and slug are required');

      const result = await api('/types', {
        method: 'POST',
        body: JSON.stringify({ name, slug, description: description || undefined, fields: pendingFields }),
      });
      if (result?.id) {
        toast('Content type created!');
        closeModal('createTypeModal');
        loadPage(currentPage);
      }
    }

    async function deleteType(id) {
      if (!confirm('Delete this content type?')) return;
      await api('/types/' + id, { method: 'DELETE' });
      toast('Deleted');
      loadPage(currentPage);
    }

    // --- Entry CRUD ---
    async function openCreateEntry() {
      if (!contentTypes.length) {
        contentTypes = await api('/types') || [];
      }
      if (!contentTypes.length) return toast('Create a content type first');
      const sel = document.getElementById('entryTypeSelect');
      sel.innerHTML = contentTypes.map(t => `<option value="${t.id}" data-slug="${t.slug}">${t.name}</option>`).join('');
      loadEntryForm();
      openModal('createEntryModal');
    }

    function loadEntryForm() {
      const sel = document.getElementById('entryTypeSelect');
      const typeId = sel.value;
      const type = contentTypes.find(t => t.id === typeId);
      if (!type) return;
      const fields = Array.isArray(type.fields) ? type.fields : (typeof type.fields === 'string' ? JSON.parse(type.fields) : []);
      document.getElementById('entryFormFields').innerHTML = fields.map(f => `
        <div class="form-group">
          <label>${f.label || f.name} <small style="color:#999">(${f.type})</small></label>
          ${f.type === 'boolean'
            ? `<select data-field="${f.name}"><option value="false">False</option><option value="true">True</option></select>`
            : f.type === 'textarea' || f.type === 'richtext'
            ? `<textarea data-field="${f.name}" rows="3"></textarea>`
            : f.type === 'number'
            ? `<input type="number" data-field="${f.name}">`
            : `<input type="text" data-field="${f.name}">`
          }
        </div>
      `).join('');
    }

    async function createEntry() {
      const typeId = document.getElementById('entryTypeSelect').value;
      const locale = document.getElementById('entryLocale').value;
      const data = {};
      document.querySelectorAll('#entryFormFields [data-field]').forEach(el => {
        const key = el.dataset.field;
        let val = el.value;
        if (el.type === 'number') val = val ? Number(val) : null;
        if (el.tagName === 'SELECT' && (val === 'true' || val === 'false')) val = val === 'true';
        data[key] = val;
      });

      const result = await api('/entries', {
        method: 'POST',
        body: JSON.stringify({ contentTypeId: typeId, data, locale }),
      });
      if (result?.id) {
        toast('Entry created!');
        closeModal('createEntryModal');
        loadPage(currentPage);
      }
    }

    async function approveEntry(id) { await api('/entries/' + id + '/approve', { method: 'POST' }); toast('Approved'); loadPage(currentPage); }
    async function publishEntry(id) { await api('/entries/' + id + '/publish', { method: 'POST' }); toast('Published'); loadPage(currentPage); }
    async function unpublishEntry(id) { await api('/entries/' + id + '/unpublish', { method: 'POST' }); toast('Unpublished'); loadPage(currentPage); }
    async function deleteEntry(id) {
      if (!confirm('Delete this entry?')) return;
      await api('/entries/' + id, { method: 'DELETE' });
      toast('Deleted');
      loadPage(currentPage);
    }

    // Auto-generate slug from name
    document.getElementById('typeName').addEventListener('input', e => {
      document.getElementById('typeSlug').value = e.target.value
        .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    });

    // Init
    loadPage('dashboard');
  </script>
</body>
</html>
